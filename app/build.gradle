plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.douyinsdr'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.douyinsdr"
        minSdk 26          // 兼容 Android 8.0+（KSU/LSPosed 常用基线）
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Xposed API 仅在编译期使用，运行时由 LSPosed 提供（compileOnly 勿改）
    compileOnly 'de.robv.android.xposed:api:82'
}
